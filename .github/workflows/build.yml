name: Build Xperia XZ2 (akari) KernelSU-Next + SUSFS Kernel

on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'ROM variant(s) to build'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - pn553
          - cxd224
  push:
    branches: [ main, master ]
    paths:
      - 'kernel_ksu_susfs/**'
      - '.github/workflows/build.yml'

jobs:
  build-kernel-and-susfs:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential cpio curl flex git \
            libelf-dev libncurses5-dev libssl-dev python3 unzip zip \
            zlib1g-dev

      - name: Cache toolchains & upstream sources
        uses: actions/cache@v4
        with:
          path: |
            kernel_ksu_susfs/toolchain
            kernel_ksu_susfs/src_cache
          key: akari-ksu34-susfs230-v1-${{ hashFiles('kernel_ksu_susfs/scripts/integrate_and_build.sh') }}

      - name: Run KernelSU-Next v3.4 + SUSFS v2.3.0 integration & build
        env:
          BUILD_VARIANTS: ${{ github.event.inputs.variant == 'pn553' && 'pn553' || (github.event.inputs.variant == 'cxd224' && 'cxd224' || 'pn553 cxd224') }}
        run: |
          chmod +x kernel_ksu_susfs/scripts/*.sh kernel_ksu_susfs/scripts/*.py
          bash kernel_ksu_susfs/scripts/integrate_and_build.sh

      - name: Verify outputs and generate checksums
        run: |
          cd kernel_ksu_susfs/build_out
          unzip -tq susfs4ksu-module-v2.3.0-ksu-next.zip
          for z in AnyKernel3-KSU-Next-SUSFS-akari-*.zip; do
            unzip -tq "$z"
          done
          sha256sum *.zip artifacts/*/Image.gz-dtb artifacts/*/*.ko 2>/dev/null | tee SHA256SUMS.txt

      - name: Upload Kernel Image & AnyKernel3 (PN553 - Global)
        if: always() && (github.event.inputs.variant != 'cxd224')
        uses: actions/upload-artifact@v4
        with:
          name: akari-pn553-ksu-next-susfs
          if-no-files-found: warn
          path: |
            kernel_ksu_susfs/build_out/artifacts/pn553/Image.gz-dtb
            kernel_ksu_susfs/build_out/artifacts/pn553/defconfig_resolved
            kernel_ksu_susfs/build_out/artifacts/pn553/utsrelease.h
            kernel_ksu_susfs/build_out/AnyKernel3-KSU-Next-SUSFS-akari-PN553.zip
            kernel_ksu_susfs/build_out/SHA256SUMS.txt

      - name: Upload Kernel Image, AnyKernel3 & CXD224 ko (CXD224 - Japan)
        if: always() && (github.event.inputs.variant != 'pn553')
        uses: actions/upload-artifact@v4
        with:
          name: akari-cxd224-ksu-next-susfs
          if-no-files-found: warn
          path: |
            kernel_ksu_susfs/build_out/artifacts/cxd224/Image.gz-dtb
            kernel_ksu_susfs/build_out/artifacts/cxd224/sony_carillon_nfc.ko
            kernel_ksu_susfs/build_out/artifacts/cxd224/defconfig_resolved
            kernel_ksu_susfs/build_out/artifacts/cxd224/utsrelease.h
            kernel_ksu_susfs/build_out/AnyKernel3-KSU-Next-SUSFS-akari-CXD224.zip
            kernel_ksu_susfs/build_out/SHA256SUMS.txt

      - name: Upload SUSFS4KSU Module ZIP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: susfs4ksu-module-v2.3.0-ksu-next
          if-no-files-found: warn
          path: |
            kernel_ksu_susfs/build_out/susfs4ksu-module-v2.3.0-ksu-next.zip
            kernel_ksu_susfs/build_out/SHA256SUMS.txt

      - name: Upload Build Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-build-logs
          if-no-files-found: warn
          path: |
            kernel_ksu_susfs/build_out/build_*.log
